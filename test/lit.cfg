# from llvm-project/libcxx/test/configs/cmake-bridge.cfg.in

import os, platform, site, sys

IS_WINDOWS = platform.system() == 'Windows'

config.target_triple = 'x86_64-pc-windows-msvc' if IS_WINDOWS else 'x86_64-pc-linux-gnu'
config.std = 'c++17'
config.enable_experimental = False

# Auto-detect GPULIB_SOURCE_DIR from this file's location (test/lit.cfg -> gpulib root)
_THIS_DIR = os.path.dirname(os.path.abspath(__file__))
GPULIB_SOURCE_DIR = os.environ.get('GPULIB_SOURCE_DIR', os.path.dirname(_THIS_DIR))
GPULIB_BUILD_DIR = os.environ.get('GPULIB_BUILD_DIR', os.path.join(GPULIB_SOURCE_DIR, 'build'))
ROCM_PATH = os.environ.get('ROCM_PATH', '/opt/rocm')

if IS_WINDOWS:
    ROCM_PATH = os.environ.get('ROCM_PATH', os.environ.get('HIP_PATH'))
    if ROCM_PATH is None:
        lit_config.fatal('Set HIP_PATH or ROCM_PATH env var to your ROCm install root')
else:
    ROCM_PATH = os.environ.get('ROCM_PATH', '/opt/rocm')

# Prefer hipcc on both platforms — clang++ doesn't compile .cpp as HIP
# (it uses -x c++ instead of -x hip, missing __host__/__device__ keywords)
if IS_WINDOWS:
    _hipcc = os.path.join(ROCM_PATH, 'bin', 'hipcc.exe')
else:
    _hipcc = os.path.join(ROCM_PATH, 'bin', 'hipcc')
compiler_path = _hipcc if os.path.exists(_hipcc) else 'hipcc'

config.compiler = compiler_path

site.addsitedir(os.path.join(GPULIB_SOURCE_DIR, 'test/utils'))
import libcxx.test.format

# Basic configuration of the test suite
config.name = 'hipThreads'
config.test_source_root = os.path.join(GPULIB_SOURCE_DIR, 'test')
config.test_format = libcxx.test.format.CxxStandardLibraryTest()
config.recursiveExpansionLimit = 10
config.test_exec_root = os.path.join(GPULIB_BUILD_DIR, 'test')

# Add substitutions for bootstrapping the test suite configuration
import shlex
config.substitutions.append(('%{cxx}', shlex.quote(compiler_path)))
config.substitutions.append(('%{executor}', f'{sys.executable} {os.path.join(GPULIB_SOURCE_DIR, "test/utils/run.py")}'))
config.substitutions.append(('%{test-tools}', os.path.join(GPULIB_SOURCE_DIR, 'test/utils')))
config.substitutions.append(('%{benchmark_flags}', 
    f'-I {os.path.join(GPULIB_BUILD_DIR, "test/benchmarks/google-benchmark/include")} '
    f'-L {os.path.join(GPULIB_BUILD_DIR, "test/benchmarks/google-benchmark/lib")} '
    f'-L {os.path.join(GPULIB_BUILD_DIR, "test/benchmarks/google-benchmark/lib64")} '
    '-l benchmark'))

# On Windows, hipcc has no GPU auto-detection; without --offload-arch it defaults
# to gfx906, causing linker errors against hipthreads built for a different arch.
_hip_arch = os.environ.get('HIP_ARCHITECTURES', '')
_arch_flag = f' --offload-arch={_hip_arch}' if _hip_arch else ''
# CMake builds hipthreads with the dynamic CRT (/MD), but hipcc defaults to static
# CRT (/MT) when invoked directly. This mismatch causes lld-link /failifmismatch
# errors, so we force the dynamic CRT to match.
_win_runtime = ' -D_DLL -D_MT -Xclang --dependent-lib=msvcrt' if IS_WINDOWS else ''
config.substitutions.append(('%{flags}',
    f'-Wno-unused-command-line-argument -v -fgpu-rdc{_arch_flag}{_win_runtime}'
))

rocm_include = os.path.join(ROCM_PATH, 'include')

# Determine libhipcxx include path
# In CI (venv setup): ROCM_PATH contains site-packages, libhipcxx is at venv base include
# Locally: libhipcxx is at ROCM_PATH/include/libhipcxx
if 'site-packages' in ROCM_PATH:
    # Extract venv base path from ROCM_PATH
    # e.g., /path/to/.venv/lib/python3.12/site-packages/_rocm_sdk_devel -> /path/to/.venv
    venv_base = ROCM_PATH.split('/lib/python')[0] if '/lib/python' in ROCM_PATH else ROCM_PATH
    venv_include = os.path.join(venv_base, 'include')
    # Need both .venv/include (for cuda/) and .venv/include/libhipcxx (for hip/ namespace)
    libhipcxx_include = f'-isystem "{venv_include}" -isystem "{os.path.join(venv_include, "libhipcxx")}" '
else:
    # Local installation: libhipcxx is at rocm_include/libhipcxx
    libhipcxx_include = f'-isystem "{os.path.join(rocm_include, "libhipcxx")}" '

# _CRT_SECURE_NO_WARNINGS: MSVC headers deprecate fopen/sscanf/etc, which becomes
#   errors under -Werror.
# NOMINMAX: prevent <windows.h> min/max macros from breaking std::max() calls in
#   hipthreads and libhipcxx headers.
_win_extra = '-D_CRT_SECURE_NO_WARNINGS -DNOMINMAX ' if IS_WINDOWS else ''
config.substitutions.append(('%{compile_flags}',
    f'{_win_extra}-D_LIBCUDACXX_ALLOW_UNSUPPORTED_ARCHITECTURE -isystem "{rocm_include}" '
    f'{libhipcxx_include}'
    f'-I {os.path.join(GPULIB_SOURCE_DIR, "inc")} '
    f'-I {os.path.join(GPULIB_SOURCE_DIR, "test/support")} -flax-vector-conversions=all'
))
config.substitutions.append(('%{link_flags}',
    f'-latomic -lhipthreads -L {os.path.join(GPULIB_BUILD_DIR, "lib")}'
))
ld_library_path = os.environ.get('LD_LIBRARY_PATH', os.path.join(ROCM_PATH, 'lib'))
config.environment['LD_LIBRARY_PATH'] = ld_library_path
config.substitutions.append(('%{exec}',
    f'mkdir -p %t.d && %{{executor}} --execdir %t.d --env LD_LIBRARY_PATH={ld_library_path} -- '
))

# Link flags — Windows doesn't need -latomic (GCC-specific).
# TheRock embeds /DEFAULTLIB:c++ in amdhip64.lib but doesn't ship libc++ on Windows,
# and clang's HIP driver auto-injects -lc++. Suppress both; MSVC's stdlib pulls in
# automatically via #pragma comment(lib, "msvcprt") from MSVC headers.
if IS_WINDOWS:
    config.substitutions.append(('%{link_flags}',
        f'-lhipthreads -L "{os.path.join(GPULIB_BUILD_DIR, "lib")}" '
        f'-nostdlib++ -Xlinker /NODEFAULTLIB:c++.lib'
    ))
else:
    config.substitutions.append(('%{link_flags}',
        f'-latomic -lhipthreads -L "{os.path.join(GPULIB_BUILD_DIR, "lib")}"'
    ))

# Executor + library path environment
# Windows: cmd.exe for mkdir; uses PATH (no LD_LIBRARY_PATH on Windows)
# Linux: mkdir -p; LD_LIBRARY_PATH forwarded to spawned test binaries via --env
if IS_WINDOWS:
    config.environment['PATH'] = os.environ.get('PATH', '')
    config.substitutions.append(('%{exec}',
        'cmd /c "if not exist %t.d mkdir %t.d" && %{executor} --execdir %t.d -- '
    ))
else:
    ld_library_path = os.environ.get('LD_LIBRARY_PATH', os.path.join(ROCM_PATH, 'lib'))
    config.environment['LD_LIBRARY_PATH'] = ld_library_path
    config.substitutions.append(('%{exec}',
        f'mkdir -p %t.d && %{{executor}} --execdir %t.d --env LD_LIBRARY_PATH={ld_library_path} -- '
    ))

import libcxx.test.params, libcxx.test.config
libcxx.test.config.configure(
    libcxx.test.params.DEFAULT_PARAMETERS,
    libcxx.test.features.DEFAULT_FEATURES,
    config,
    lit_config
)

# Override flags added by configure() that conflict with HIP compilation
new_substitutions = []
for (key, value) in config.substitutions:
    if key == '%{compile_flags}':
        # If 'none' is present, replace it; otherwise append 'all' to the end
        if '-flax-vector-conversions=none' in value:
            value = value.replace('-flax-vector-conversions=none', '-flax-vector-conversions=all')
        else:
            value = value + ' -flax-vector-conversions=all'

        # Ensure libhipcxx "#warning" doesn't become an error under -Werror
        if '-Wno-error=#warnings' not in value:
            value = value + ' -Wno-error=#warnings'

    if key == '%{flags}':
        # Put this late so it can override a later-added -Werror
        if '-Wno-error=#warnings' not in value:
            value = value + ' -Wno-error=#warnings'

    new_substitutions.append((key, value))
config.substitutions = new_substitutions

# Run tests with: pip install lit && lit -a -v -j 1 test/
